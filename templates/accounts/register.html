{% extends "accounts/auth_card.html" %}
{% block title %}Register{% endblock %}
{% block card %}
<h3 class="fw-bold mb-1">Create your account</h3>
<p class="text-muted mb-4">Join EventFlow in less than a minute.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% for field in form %}{% include "partials/form_field.html" %}{% endfor %}
  <button class="btn btn-primary w-100 mb-3">Register</button>
</form>
<p class="small mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
