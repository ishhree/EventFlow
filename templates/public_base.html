{% extends "base.html" %}
{% block body %}
<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <a class="brand" href="{% url 'landing' %}"><i class="bi bi-calendar2-check"></i>EventFlow</a>
    <div class="ms-auto d-flex gap-2">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm">Dashboard</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Login</a>
        <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Get Started</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container mt-3">{% include "partials/messages.html" %}</div>
{% block public_content %}{% endblock %}
<footer class="footer mt-5">
  <div class="container d-flex flex-wrap justify-content-between">
    <span><i class="bi bi-calendar2-check"></i> EventFlow</span>
    <span>&copy; 2026 EventFlow - College Project</span>
  </div>
</footer>
{% endblock %}
